<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080F" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Ñawi: explora observaciones infrarrojas de SPHEREx a través del tiempo." />
    <title>Ñawi — Explorador SPHEREx</title>

    <!-- Helios: dos familias. Urbanist lleva los pesos 200/300 que son el
         carácter del tema; JetBrains Mono los rótulos y las cifras. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100;200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Idioma antes del primer paint: ?lang > localStorage > navegador > es.
      (function () {
        try {
          var soportados = ['es', 'en'];
          var normalizar = function (valor) {
            if (!valor) return null;
            var base = String(valor).trim().toLowerCase().split(/[-_]/)[0];
            return soportados.indexOf(base) >= 0 ? base : null;
          };
          var deUrl = normalizar(new URLSearchParams(location.search).get('lang'));
          var guardado = normalizar(localStorage.getItem('nawi-lang'));
          var delNavegador = normalizar(navigator.language) || (navigator.languages || []).map(normalizar).filter(Boolean)[0] || null;
          var lang = deUrl || guardado || delNavegador || 'es';
          document.documentElement.setAttribute('lang', lang);
          if (lang === 'en') {
            document.title = 'Ñawi — SPHEREx Explorer';
            var meta = document.querySelector('meta[name="description"]');
            if (meta) meta.setAttribute('content', 'Ñawi: explore SPHEREx infrared observations across time.');
          }
        } catch (error) { /* sin localStorage: queda lang="es" */ }
      })();

      // Tema oscuro por defecto; restaura el claro solo si se eligió explícitamente.
      (function () {
        try {
          var saved = localStorage.getItem('nawi-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#E9ECF5' : '#07080F');
        } catch (error) { /* sin localStorage: queda el tema oscuro por defecto */ }
      })();
    </script>
  </head>
  <body class="hx-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
